<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7541a8"><title>SEREA | Business Studio</title><style>
:root{--purple:#7541a8;--purple2:#a77bd1;--lilac:#efe4fa;--lav:#f8f4fc;--ink:#30263b;--muted:#82778c;--line:#eadff2;--green:#25845e;--red:#b34b65;--gold:#a97925}*{box-sizing:border-box}body{margin:0;background:#fbf9fd;color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:238px;background:#fff;border-right:1px solid var(--line);padding:24px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{padding:4px 12px 24px}.brand b{font:700 27px Georgia;color:var(--purple);letter-spacing:3px}.brand small{display:block;color:var(--muted);letter-spacing:2px;font-size:9px;margin-top:4px}.navlabel{font-size:10px;color:#a69aad;font-weight:700;letter-spacing:1.4px;padding:14px 12px 7px}.nav button{display:flex;width:100%;border:0;background:none;color:#685d72;padding:10px 12px;border-radius:11px;text-align:left;gap:11px;align-items:center;font:600 13px inherit;cursor:pointer}.nav button.active,.nav button:hover{background:var(--lilac);color:var(--purple)}.main{margin-left:238px;width:calc(100% - 238px);padding:26px 30px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font-size:11px;color:var(--purple);font-weight:700;letter-spacing:1.5px;text-transform:uppercase}.top h1{font-size:26px;margin:4px 0;font-family:Georgia,serif}.sub{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--purple);border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}.btn.primary{background:var(--purple);color:white;border-color:var(--purple)}.btn:hover{filter:brightness(.97)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 3px 15px #3c205008}.metric .label{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:25px;margin:7px 0 2px}.metric small{color:var(--muted)}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card h3{font:700 17px Georgia;margin:0 0 14px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.sectionhead h2{font:700 21px Georgia;margin:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid #f0eaf4;font-size:12px}th{color:var(--muted);font-weight:700;background:#fcfaff}td strong{font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:var(--lilac);color:var(--purple);font-size:10px;font-weight:700}.positive{color:var(--green)}.negative{color:var(--red)}.bar{height:8px;border-radius:20px;background:#f0e9f6;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8d56bd,#c6a5e5);border-radius:20px}.insight{padding:13px;border-radius:12px;background:var(--lav);margin:9px 0}.insight b{display:block;margin-bottom:4px}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px;color:var(--ink);font:inherit}.field input:focus,.field select:focus{outline:2px solid #d8c0ed}.modal{position:fixed;inset:0;background:#20132b66;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.open{display:flex}.modalbox{background:#fff;border-radius:18px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h3{margin:0;font:700 21px Georgia}.close{border:0;background:var(--lav);border-radius:50%;width:32px;height:32px;cursor:pointer}.empty{padding:28px;text-align:center;color:var(--muted)}.mobilehead{display:none}.footnote{font-size:11px;color:var(--muted);margin-top:12px}.scenario{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scenario .result{background:var(--lav);border-radius:12px;padding:14px}.result strong{font-size:23px;display:block}.hide{display:none!important}
@media(max-width:900px){.side{width:72px;padding:15px 8px}.brand{padding:5px 6px 20px}.brand b{font-size:18px;letter-spacing:1px}.brand small,.navlabel,.nav button span.txt{display:none}.nav button{justify-content:center;font-size:18px;padding:12px 5px}.main{margin-left:72px;width:calc(100% - 72px);padding:20px 16px 45px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.main{padding:16px 12px 40px}.top{align-items:flex-start;gap:10px;flex-direction:column}.top h1{font-size:23px}.grid{gap:8px}.metric strong{font-size:20px}.card{padding:13px}.formgrid,.scenario{grid-template-columns:1fr}.actions .btn{padding:8px 10px}.side{width:58px}.main{margin-left:58px;width:calc(100% - 58px)}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><b>SEREA</b><small>BUSINESS STUDIO</small></div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav"><button class="active" data-page="dashboard">◫ <span class="txt">Overview</span></button><button data-page="products">✿ <span class="txt">Products</span></button><button data-page="materials">▦ <span class="txt">Raw Materials</span></button><button data-page="costing">⌗ <span class="txt">Product Costing</span></button><button data-page="purchases">＋ <span class="txt">Purchases</span></button><button data-page="production">⚒ <span class="txt">Production</span></button><button data-page="sales">▤ <span class="txt">Sales & Pipeline</span></button><button data-page="cash">₱ <span class="txt">Cash Flow</span></button><button data-page="forecast">↗ <span class="txt">ROI & Forecast</span></button></nav><div class="footnote">Your candle business, in one place.</div></aside><main class="main"><header class="top"><div><div class="eyebrow">SEREA / BUSINESS STUDIO</div><h1 id="pageTitle">Your business at a glance</h1><div class="sub" id="pageSub">A clearer view of your costs, sales, stock, and growth.</div></div><div class="actions"><button class="btn" onclick="backup()">↓ Backup data</button><button class="btn" onclick="document.getElementById('restore').click()">↑ Import backup</button><input id="restore" type="file" accept="application/json" hidden onchange="restoreData(event)"></div></header><section id="content"></section></main></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle">Add record</h3><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script src="serea_seed_data.js"></script><script>
const seed=window.SEREA_SEED||{};const load=(k)=>{try{return JSON.parse(localStorage.getItem('serea_'+k))??(seed[k]||[])}catch{return seed[k]||[]}};let db={products:load('products'),materials:load('materials'),purchases:load('purchases'),recipes:load('recipes'),production:load('production'),sales:load('sales'),cash:load('cash'),pipeline:load('pipeline')};const map={products:'Product Master',materials:'Raw Materials',purchases:'Purchases',recipes:'Costing Master',production:'Production Log',sales:'Sales',cash:'Cash Flow'};function save(){Object.keys(db).forEach(k=>localStorage.setItem('serea_'+k,JSON.stringify(db[k])))}function num(v){return Number(v)||0}function money(v){return '₱'+num(v).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}function clean(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function get(o,...keys){for(const k of keys)if(o[k]!==undefined)return o[k];return ''}function productName(p){return get(p,'Product Name','Product Name ')}function matName(m){return get(m,'Material Name')}function recipeCost(name){return db.recipes.filter(r=>get(r,'Product Name')===name).reduce((s,r)=>s+num(get(r,'Cost per Product Line (₱)')||num(get(r,'Qty per Product'))*num(get(r,'Unit Cost (₱)'))*(1+num(get(r,'Buffer %')))),0)}function srp(name){let p=db.products.find(p=>productName(p)===name);return num(get(p||{},'SRP'))}function sum(a,fn){return a.reduce((s,x)=>s+fn(x),0)}function saveRender(){save();render(current)}let current='dashboard';const titles={dashboard:['Your business at a glance','A clearer view of your costs, sales, stock, and growth.'],products:['Product master','Manage your products, categories, and selling prices.'],materials:['Raw materials','Add materials, packaging, stock quantities, and unit costs.'],costing:['Product costing','Build a recipe with as many ingredient and packaging lines as needed.'],purchases:['Purchases','Track supplier purchases, pack sizes, and cash paid.'],production:['Production log','Record batches and calculate the cost of what you make.'],sales:['Sales & pipeline','Track orders from inquiry to completed sale, including collections.'],cash:['Cash flow','Record owner capital, expenses, other receipts, and withdrawals.'],forecast:['ROI & forecast','See capital recovery, profit scenarios, and sales targets.']};document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b){current=b.dataset.page;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render(current)}});
function metric(label,value,note=''){return `<div class="card metric"><div class="label">${label}</div><strong>${value}</strong><small>${note}</small></div>`}function table(headers,rows){return `<div class="card tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">No records yet. Add your first record to get started.</td></tr>'}</tbody></table></div>`}function addBtn(label,fn){return `<button class="btn primary" onclick="${fn}">＋ ${label}</button>`}function section(title,button=''){return `<div class="sectionhead"><h2>${title}</h2>${button}</div>`}function render(page){current=page;document.getElementById('pageTitle').textContent=titles[page][0];document.getElementById('pageSub').textContent=titles[page][1];let el=document.getElementById('content');el.innerHTML=({dashboard:dashboard,products:productsPage,materials:materialsPage,costing:costingPage,purchases:purchasesPage,production:productionPage,sales:salesPage,cash:cashPage,forecast:forecastPage})[page]();}
function dashboard(){let invested=sum(db.purchases,p=>num(get(p,'Total Purchase (₱)')))||14736.51;let revenue=sum(db.sales,s=>num(get(s,'Sales Revenue (₱)'))||num(get(s,'Qty Sold'))*srp(get(s,'Product Name')));let cogs=sum(db.sales,s=>num(get(s,'COGS (₱)'))||num(get(s,'Qty Sold'))*recipeCost(get(s,'Product Name')));let collected=sum(db.sales,s=>num(get(s,'Amount Collected (₱)')));let gross=revenue-cogs;let expenses=sum(db.cash,c=>get(c,'Direction')==='Out'?num(get(c,'Amount (₱)')):0);let net=gross-expenses;let roi=invested?net/invested*100:0;let best=[...db.products].map(p=>({name:productName(p),profit:srp(productName(p))-recipeCost(productName(p))})).sort((a,b)=>b.profit-a.profit).filter(x=>x.name)[0];let inv=db.products.map(p=>{let n=productName(p);let made=sum(db.production,x=>get(x,'Product Name')===n?num(get(x,'Qty Produced')):0);let sold=sum(db.sales,x=>get(x,'Product Name')===n?num(get(x,'Qty Sold')):0);return {n,made,sold,stock:made-sold}}).filter(x=>x.n);return `<div class="grid">${metric('Total purchases / investment',money(invested),'Recorded purchase value')}${metric('Sales revenue',money(revenue),'Recorded product sales')}${metric('Gross profit',money(gross),'Sales less product costs')}${metric('Estimated net profit',money(net),'After recorded cash expenses')}</div><div class="two"><div class="card"><h3>Capital recovery</h3><div style="display:flex;justify-content:space-between;margin:12px 0"><span class="sub">Estimated profit vs purchases</span><b>${roi.toFixed(1)}%</b></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,roi))}%"></i></div><p class="footnote">Sales collected: ${money(collected)} · Purchase payments and operating cash movements are tracked separately.</p><div class="insight"><b>Product to watch</b>${best?`${clean(best.name)} has an estimated contribution of ${money(best.profit)} per piece based on current recipe and SRP.`:'Add product recipes and SRPs to see which item has the best profit per piece.'}</div></div><div class="card"><h3>Quick business signals</h3><div class="insight"><b>Cash collection</b>${money(collected)} collected from recorded sales.</div><div class="insight"><b>Uncollected sales</b>${money(revenue-collected)} still unpaid or partially paid.</div><div class="insight"><b>Inventory</b>${sum(inv,x=>x.stock)} estimated finished units on hand.</div></div></div>${section('Finished goods snapshot')}${table(['Product','Produced','Sold','Available','SRP','Unit cost'],inv.map(x=>`<tr><td><strong>${clean(x.n)}</strong></td><td>${x.made}</td><td>${x.sold}</td><td>${x.stock}</td><td>${money(srp(x.n))}</td><td>${money(recipeCost(x.n))}</td></tr>`).join(''))}<p class="footnote">Figures are calculated from imported workbook records and any new entries. Please verify imported opening stock and historical purchase treatment before relying on stock or ROI totals.</p>`}
function productsPage(){return section('Your products',addBtn('Add product',"openForm('product')"))+table(['Product','Category','Status','SRP','Recipe cost','Profit / piece',''],db.products.map((p,i)=>{let n=productName(p),c=recipeCost(n);return `<tr><td><strong>${clean(n)}</strong></td><td>${clean(get(p,'Category'))}</td><td><span class="pill">${clean(get(p,'Status')||'Active')}</span></td><td>${money(srp(n))}</td><td>${money(c)}</td><td class="${srp(n)-c>=0?'positive':'negative'}">${money(srp(n)-c)}</td><td><button class="btn" onclick="editRecord('products',${i})">Edit</button></td></tr>`}).join(''))}
function materialsPage(){return section('Materials & packaging',addBtn('Add material',"openForm('material')"))+table(['Material','Type','Unit','Opening qty','Unit cost','Current qty','Stock value'],db.materials.map((m,i)=>{let n=matName(m);return `<tr><td><strong>${clean(n)}</strong></td><td>${clean(get(m,'Material Type'))}</td><td>${clean(get(m,'Unit'))}</td><td>${num(get(m,'Opening Qty'))}</td><td>${money(get(m,'Opening Cost / Unit (₱)'))}</td><td>${num(get(m,'Current Qty')||get(m,'Opening Qty'))}</td><td>${money(num(get(m,'Current Qty')||get(m,'Opening Qty'))*num(get(m,'Opening Cost / Unit (₱)')))}</td></tr>`}).join(''))}
function costingPage(){let names=db.products.map(productName).filter(Boolean);return `<div class="card"><h3>Recipe builder</h3><p class="sub">Select a product and add every material or packaging item used for one finished piece.</p><div class="formgrid"><div class="field"><label>Product</label><select id="recipeProduct">${names.map(n=>`<option>${clean(n)}</option>`).join('')}</select></div><div class="field"><label>Material</label><select id="recipeMaterial">${db.materials.map(m=>`<option>${clean(matName(m))}</option>`).join('')}</select></div><div class="field"><label>Quantity per product</label><input id="recipeQty" type="number" step="0.01" value="1"></div><div class="field"><label>Buffer % (e.g. 5)</label><input id="recipeBuffer" type="number" step="0.1" value="0"></div><div class="field"><label>Unit</label><input id="recipeUnit" placeholder="g / ml / pcs"></div><div class="field" style="align-self:end"><button class="btn primary" onclick="addRecipe()">＋ Add ingredient line</button></div></div></div>${section('Saved recipe lines')}${table(['Product','Type','Material','Qty','Unit','Unit cost','Line cost',''],db.recipes.map((r,i)=>`<tr><td>${clean(get(r,'Product Name'))}</td><td>${clean(get(r,'Material Type'))}</td><td>${clean(get(r,'Material Name'))}</td><td>${num(get(r,'Qty per Product'))}</td><td>${clean(get(r,'Unit'))}</td><td>${money(get(r,'Unit Cost (₱)'))}</td><td>${money(get(r,'Cost per Product Line (₱)')||num(get(r,'Qty per Product'))*num(get(r,'Unit Cost (₱)'))*(1+num(get(r,'Buffer %'))))}</td><td><button class="btn" onclick="del('recipes',${i})">Remove</button></td></tr>`).join(''))}<p class="footnote">Unit cost uses the material's recorded opening unit cost. Keep units consistent (for example, grams in recipes with cost per gram).</p>`}
function purchasesPage(){return section('Purchase history',addBtn('Add purchase',"openForm('purchase')"))+table(['Date','Supplier','Material','Qty packs','Units / pack','Cost / pack','Total','Paid','Add to stock?'],db.purchases.map(p=>`<tr><td>${clean(get(p,'Purchase Date'))}</td><td>${clean(get(p,'Supplier'))}</td><td>${clean(get(p,'Material Name'))}</td><td>${num(get(p,'Qty (Packs)'))}</td><td>${num(get(p,'Units per Pack'))}</td><td>${money(get(p,'Cost per Pack (₱)'))}</td><td>${money(get(p,'Total Purchase (₱)'))}</td><td>${money(get(p,'Amount Paid (₱)'))}</td><td>${clean(get(p,'Add to Live Stock?'))}</td></tr>`).join(''))}
function productionPage(){return section('Production batches',addBtn('Log production',"openForm('production')"))+table(['Date','Product','Qty made','Packaging option','Batch cost','Notes'],db.production.map(p=>`<tr><td>${clean(get(p,'Production Date'))}</td><td>${clean(get(p,'Product Name'))}</td><td>${num(get(p,'Qty Produced'))}</td><td>${clean(get(p,'Packaging Option'))}</td><td>${money(get(p,'Batch Cost (₱)'))}</td><td>${clean(get(p,'Notes'))}</td></tr>`).join(''))}
function salesPage(){return section('Orders & sales pipeline',addBtn('Add sale / order',"openForm('sale')"))+`<div class="grid">${['Inquiry','Quoted','Awaiting payment','Confirmed','Completed'].map(stage=>metric(stage,db.sales.filter(s=>(get(s,'Stage')||get(s,'Pipeline Stage')||'Completed')===stage).length+' orders','Tracked orders')).join('')}</div>`+table(['Date','Customer','Product','Qty','Revenue','Collected','Gross profit','Stage / payment'],db.sales.map(s=>{let n=get(s,'Product Name'),rev=num(get(s,'Sales Revenue (₱)'))||num(get(s,'Qty Sold'))*srp(n),cost=num(get(s,'COGS (₱)'))||num(get(s,'Qty Sold'))*recipeCost(n);return `<tr><td>${clean(get(s,'Sale Date'))}</td><td>${clean(get(s,'Customer'))}</td><td>${clean(n)}</td><td>${num(get(s,'Qty Sold'))}</td><td>${money(rev)}</td><td>${money(get(s,'Amount Collected (₱)'))}</td><td>${money(rev-cost)}</td><td><span class="pill">${clean(get(s,'Stage')||get(s,'Payment Status ')||'Completed')}</span></td></tr>`}).join(''))}
function cashPage(){return section('Cash flow entries',addBtn('Add cash entry',"openForm('cash')"))+table(['Date','Description','Category','Direction','Method','Amount'],db.cash.map(c=>`<tr><td>${clean(get(c,'Date'))}</td><td>${clean(get(c,'Description'))}</td><td>${clean(get(c,'Category'))}</td><td>${clean(get(c,'Direction'))}</td><td>${clean(get(c,'Payment Method'))}</td><td>${money(get(c,'Amount (₱)'))}</td></tr>`).join(''))}
function forecastPage(){let best=[...db.products].map(p=>({name:productName(p),srp:srp(productName(p)),cost:recipeCost(productName(p))})).filter(x=>x.name).sort((a,b)=>(b.srp-b.cost)-(a.srp-a.cost));return `<div class="card"><h3>Profit simulator</h3><p class="sub">Test how many pieces you need to sell to reach your target.</p><div class="formgrid"><div class="field"><label>Choose product</label><select id="simProduct" onchange="updateSim()">${best.map(p=>`<option>${clean(p.name)}</option>`).join('')}</select></div><div class="field"><label>Target gross profit (₱)</label><input id="simTarget" type="number" value="10000" oninput="updateSim()"></div><div class="field"><label>Quantity to sell</label><input id="simQty" type="number" value="100" oninput="updateSim()"></div></div><div class="scenario" style="margin-top:15px"><div class="result"><span class="sub">Projected sales</span><strong id="simRevenue">₱0.00</strong></div><div class="result"><span class="sub">Gross profit</span><strong id="simProfit">₱0.00</strong></div><div class="result"><span class="sub">Pieces for target</span><strong id="simNeeded">0</strong></div><div class="result"><span class="sub">Profit per piece</span><strong id="simUnit">₱0.00</strong></div></div></div>${section('Profitability ranking')}${table(['Product','Selling price','Recipe cost','Profit / piece','Margin'],best.map(p=>`<tr><td><strong>${clean(p.name)}</strong></td><td>${money(p.srp)}</td><td>${money(p.cost)}</td><td class="${p.srp-p.cost>=0?'positive':'negative'}">${money(p.srp-p.cost)}</td><td>${p.srp?((p.srp-p.cost)/p.srp*100).toFixed(1)+'%':'—'}</td></tr>`).join(''))}<p class="footnote">Forecasts are estimates, not guaranteed earnings. They exclude fixed overhead, discounts, taxes, delivery subsidies, and unsold stock unless entered in the relevant records.</p>`}
function updateSim(){let n=document.getElementById('simProduct')?.value||'',p=srp(n),c=recipeCost(n),q=num(document.getElementById('simQty')?.value),t=num(document.getElementById('simTarget')?.value),u=p-c;document.getElementById('simRevenue').textContent=money(p*q);document.getElementById('simProfit').textContent=money(u*q);document.getElementById('simNeeded').textContent=u>0?Math.ceil(t/u).toLocaleString():'Not profitable';document.getElementById('simUnit').textContent=money(u)}
function modal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function field(label,name,type='text',value='',opts=null){return `<div class="field"><label>${label}</label>${opts?`<select name="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${clean(o)}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${clean(value)}" ${type==='number'?'step="any"':''}>`}</div>`}
function openForm(type){let html='',title='';if(type==='product'){title='Add product';html=`<form onsubmit="submitRecord(event,'products')" class="formgrid">${field('Product name','Product Name')}${field('Category','Category','text','Candle')}${field('Status','Status','text','Active')}${field('SRP (₱)','SRP','number','0')}<button class="btn primary">Save product</button></form>`}if(type==='material'){title='Add raw material';html=`<form onsubmit="submitRecord(event,'materials')" class="formgrid">${field('Material name','Material Name')}${field('Type','Material Type','text','Raw Material')}${field('Unit','Unit','text','g')}${field('Opening quantity','Opening Qty','number','0')}${field('Cost per unit (₱)','Opening Cost / Unit (₱)','number','0')}<button class="btn primary">Save material</button></form>`}if(type==='purchase'){title='Add purchase';html=`<form onsubmit="submitPurchase(event)" class="formgrid">${field('Purchase date','Purchase Date','date',new Date().toISOString().slice(0,10))}${field('Supplier','Supplier')}${field('Material','Material Name','text','',db.materials.map(matName))}${field('Category','Category','text','Raw Material')}${field('Quantity (packs)','Qty (Packs)','number','1')}${field('Units per pack','Units per Pack','number','1')}${field('Stock unit','Stock Unit','text','g')}${field('Cost per pack (₱)','Cost per Pack (₱)','number','0')}${field('Amount paid (₱)','Amount Paid (₱)','number','0')}${field('Add to live stock?','Add to Live Stock?','text','Yes')}<button class="btn primary">Save purchase</button></form>`}if(type==='production'){title='Log production';html=`<form onsubmit="submitRecord(event,'production')" class="formgrid">${field('Production date','Production Date','date',new Date().toISOString().slice(0,10))}${field('Product','Product Name','text','',db.products.map(productName))}${field('Quantity produced','Qty Produced','number','1')}${field('Packaging option','Packaging Option')}${field('Notes','Notes')}<button class="btn primary">Save batch</button></form>`}if(type==='sale'){title='Add sale / order';html=`<form onsubmit="submitSale(event)" class="formgrid">${field('Sale date','Sale Date','date',new Date().toISOString().slice(0,10))}${field('Customer','Customer')}${field('Product','Product Name','text','',db.products.map(productName))}${field('Quantity sold','Qty Sold','number','1')}${field('Amount collected (₱)','Amount Collected (₱)','number','0')}${field('Pipeline stage','Stage','text','Inquiry',['Inquiry','Quoted','Awaiting payment','Confirmed','Completed','Lost'])}${field('Notes','Notes')}<button class="btn primary">Save order</button></form>`}if(type==='cash'){title='Add cash flow entry';html=`<form onsubmit="submitRecord(event,'cash')" class="formgrid">${field('Date','Date','date',new Date().toISOString().slice(0,10))}${field('Description','Description')}${field('Category','Category','text','Operating Expense',['Owner Capital','Other Income','Operating Expense','Tax','Owner Withdrawal','Other'])}${field('Direction','Direction','text','Out',['In','Out'])}${field('Payment method','Payment Method','text','Cash',['Cash','Bank','E-wallet','Other'])}${field('Amount (₱)','Amount (₱)','number','0')}<button class="btn primary">Save entry</button></form>`}modal(title,html)}function submitRecord(e,key){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());for(let k in o)if(['SRP','Opening Qty','Opening Cost / Unit (₱)','Qty Produced','Amount (₱)'].includes(k))o[k]=num(o[k]);db[key].push(o);closeModal();saveRender()}function submitPurchase(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());['Qty (Packs)','Units per Pack','Cost per Pack (₱)','Amount Paid (₱)'].forEach(k=>o[k]=num(o[k]));o['Total Purchase (₱)']=o['Qty (Packs)']*o['Cost per Pack (₱)'];db.purchases.push(o);closeModal();saveRender()}function submitSale(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());o['Qty Sold']=num(o['Qty Sold']);o['Amount Collected (₱)']=num(o['Amount Collected (₱)']);o['Sales Revenue (₱)']=o['Qty Sold']*srp(o['Product Name']);o['COGS (₱)']=o['Qty Sold']*recipeCost(o['Product Name']);o['Gross Profit (₱)']=o['Sales Revenue (₱)']-o['COGS (₱)'];o['Payment Status ']=o['Amount Collected (₱)']===0?'Unpaid':o['Amount Collected (₱)']<o['Sales Revenue (₱)']?'Partial':'Fully Paid';db.sales.push(o);closeModal();saveRender()}function addRecipe(){let n=document.getElementById('recipeProduct').value,m=document.getElementById('recipeMaterial').value,mat=db.materials.find(x=>matName(x)===m)||{},q=num(document.getElementById('recipeQty').value),b=num(document.getElementById('recipeBuffer').value)/100,u=document.getElementById('recipeUnit').value||get(mat,'Unit'),uc=num(get(mat,'Opening Cost / Unit (₱)'));db.recipes.push({'Product Name':n,'Material Type':get(mat,'Material Type'),'Material Name':m,'Qty per Product':q,'Unit':u,'Buffer %':b,'Unit Cost (₱)':uc,'Cost per Product Line (₱)':q*(1+b)*uc});saveRender()}function del(k,i){if(confirm('Remove this recipe line?')){db[k].splice(i,1);saveRender()}}function editRecord(k,i){let row=db[k][i];let fields=Object.keys(row).filter(x=>!x.startsWith('Purchase Value')&&!x.startsWith('Current'));modal('Edit record',`<form class="formgrid" onsubmit="event.preventDefault();let f=Object.fromEntries(new FormData(event.target).entries());Object.assign(db['${k}'][${i}],f);saveRender();closeModal()">${fields.map(f=>field(f,f,'text',row[f])).join('')}<button class="btn primary">Save changes</button></form>`)}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='serea-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);Object.keys(db).forEach(k=>{if(Array.isArray(d[k]))db[k]=d[k]});saveRender();alert('Backup imported successfully.')}catch{alert('Invalid backup file.')}};r.readAsText(f)}
render('dashboard');if(current==='forecast')updateSim();const origRender=render;render=function(p){origRender(p);if(p==='forecast')updateSim()};
</script></body></html>
