const load=(k)=>{try{const v=localStorage.getItem('serea_'+k);return v===null?(SEED[k]||[]):JSON.parse(v)}catch{return SEED[k]||[]}};
let db={products:load('products'),materials:load('materials'),purchases:load('purchases'),recipes:load('recipes'),production:load('production'),sales:load('sales'),cash:load('cash'),pipeline:load('pipeline')};
const pages=[['dashboard','⌂','Home'],['products','◇','Products & Costing'],['materials','▤','Inventory'],['sales','▥','Orders'],['reports','▧','Reports'],['manifest','♡','My Space'],['todo','☑','To-Do'],['sounds','♫','Sounds']];let current='dashboard';
const $=id=>document.getElementById(id), num=v=>Number(v)||0, money=v=>'₱'+num(v).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}), get=(o,...ks)=>{for(const k of ks)if(o&&o[k]!==undefined)return o[k];return ''}, clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0), pname=p=>get(p,'Product Name'), mname=m=>get(m,'Material Name');
function save(){Object.keys(db).forEach(k=>localStorage.setItem('serea_'+k,JSON.stringify(db[k])))}
function recipeCost(n){return sum(db.recipes.filter(r=>get(r,'Product Name')===n),r=>num(get(r,'Cost per Product Line (₱)'))||num(get(r,'Qty per Product'))*num(get(r,'Unit Cost (₱)'))*(1+num(get(r,'Buffer %'))))}
function srp(n){let p=db.products.find(x=>pname(x)===n);return num(get(p||{},'SRP'))}
function revenue(){return sum(db.sales,s=>num(get(s,'Sales Revenue (₱)'))||num(get(s,'Qty Sold'))*srp(get(s,'Product Name')))}
function expenses(){return sum(db.cash,c=>get(c,'Direction')==='Out'?num(get(c,'Amount (₱)')):0)}
function dayCount(){const a=new Date(START_DATE+'T00:00:00'),b=new Date();return Math.max(1,Math.floor((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000)+1)}
function init(){const d=new Date();$('today').textContent=d.toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',year:'numeric'});$('greeting').textContent=(d.getHours()<12?'Good morning':d.getHours()<18?'Good afternoon':'Good evening')+'! 💜';$('nav').innerHTML=pages.map(([id,ico,label])=>`<button data-page="${id}" class="${id===current?'active':''}" onclick="render('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('');render('dashboard')}
function metric(label,value,note,ico){return `<div class="card metric"><span class="symbol">${ico||'✦'}</span><div class="label">${label}</div><strong>${value}</strong><small>${note||''}</small></div>`}
function sectionTable(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="muted">No records yet.</td></tr>`}</tbody></table></div>`}
const affirmations=['I am building a brand that grows through creativity, consistency, and purpose.','I welcome meaningful orders, happy customers, and steady growth.','My ideas have value, and I give them room to grow.','I trust my progress and keep showing up for my business.','I make thoughtful decisions and create opportunities every day.'];
const ideas=['Create a limited-time scent bundle to encourage customers to try more than one fragrance.','Post a short behind-the-scenes video showing how you pour and finish each candle.','Invite past customers to share a photo or review, then feature it on your page.','Offer a simple gift set with a candle and a handwritten message card.','Create a weekly scent spotlight explaining the mood and notes of one fragrance.','Prepare a small seasonal pre-order collection to plan production more efficiently.'];
function attentionHTML(){let low=db.materials.filter(m=>num(get(m,'Minimum Stock'))>0&&num(get(m,'Current Qty')||get(m,'Opening Qty'))<=num(get(m,'Minimum Stock')));let pending=db.sales.filter(o=>!['Delivered','Fully Paid','Completed'].includes(get(o,'Stage')));let items=[];low.forEach(m=>items.push(`<div class="priority">⚠️ <b>Low stock:</b> ${clean(mname(m))} — ${num(get(m,'Current Qty')||get(m,'Opening Qty'))} ${clean(get(m,'Unit'))} left · <a href="#" onclick="render('materials');return false">Open Inventory ↗</a></div>`));pending.forEach(o=>items.push(`<div class="priority">📦 <b>Order needs action:</b> ${clean(get(o,'Customer')||'Customer')} · ${clean(get(o,'Product Name'))} · ${clean(get(o,'Stage'))} · <a href="#" onclick="render('sales');return false">Open Orders ↗</a></div>`));return items.join('')||'<p class="muted">You’re all caught up! 💜</p>'}
function dashboard(){let rev=revenue(),cost=sum(db.sales,s=>num(get(s,'COGS (₱)'))||num(get(s,'Qty Sold'))*recipeCost(get(s,'Product Name'))),net=rev-cost-expenses(),invested=sum(db.purchases,p=>num(get(p,'Total Purchase (₱)'))),collected=sum(db.sales,s=>num(get(s,'Amount Collected (₱)'))),orders=db.sales.length,stock=db.products.reduce((a,p)=>a+Math.max(0,sum(db.production,x=>get(x,'Product Name')===pname(p)?num(get(x,'Qty Produced')):0)-sum(db.sales,x=>get(x,'Product Name')===pname(p)?num(get(x,'Qty Sold')):0)),0);let d=dayCount(),idx=Math.floor((Date.now()/86400000))%ideas.length;let bars=[...db.sales].slice(-7);let max=Math.max(1,...bars.map(s=>num(get(s,'Sales Revenue (₱)'))||num(get(s,'Qty Sold'))*srp(get(s,'Product Name'))));let chart=bars.length?bars.map((s,i)=>{let v=num(get(s,'Sales Revenue (₱)'))||num(get(s,'Qty Sold'))*srp(get(s,'Product Name'));return `<div class="barcol"><i style="height:${Math.max(5,v/max*100)}%" title="${money(v)}"></i><span>${clean((get(s,'Sale Date')||'').slice(5,10)||'Sale '+(i+1))}</span></div>`}).join(''):`<div class="muted">Add sales to see your chart.</div>`;return `<section class="hero"><div class="journey"><div class="kicker">✦ SEREA business journey</div><div class="day">DAY ${String(d).padStart(2,'0')}</div><div class="since">Since November 2, 2026</div><div class="journey-note">${d} days of building something meaningful. Keep going. 💜</div></div><div class="daily"><div class="dailycard"><div class="tag">♡ Today's affirmation</div><p>“${affirmations[d%affirmations.length]}”</p></div><div class="dailycard"><div class="tag">✧ Today's business idea</div><p class="idea">${ideas[idx]}</p></div></div></section><section class="card" style="margin-bottom:14px"><h2>Needs Your Attention</h2>${attentionHTML()}</section><section class="metrics">${metric('Total Sales',money(rev),'Recorded sales revenue','↗')}${metric('Total Expenses',money(expenses()),'Recorded cash outflows','−')}${metric('Estimated Net Profit',money(net),'After product costs and cash expenses','✧')}${metric('Finished Goods',stock,'Estimated units on hand','◇')}${metric('Orders',orders,'Recorded sales entries','▣')}</section><section class="lower"><div class="card"><h2>Sales Overview</h2><div class="chart">${chart}</div><p class="notice">Based on the latest recorded sales entries.</p></div><div class="card"><h2>Quick Actions</h2><div class="quick"><button onclick="openForm('product')"><span>◇</span>Add Product</button><button onclick="openForm('sale')"><span>＋</span>Record Sale</button><button onclick="openForm('cash')"><span>₱</span>Add Expense</button><button onclick="openForm('material')"><span>▤</span>Add Material</button><button onclick="openForm('production')"><span>⚗</span>Production</button><button onclick="render('reports')"><span>▧</span>Reports</button></div></div><div class="card"><h2>Milestones</h2>${mile('First sale',orders>=1,orders>=1?'Reached':'Your first customer order')}${mile('10 orders',orders>=10,orders+' / 10 orders',Math.min(100,orders/10*100))}${mile('₱10,000 revenue',rev>=10000,money(rev)+' / ₱10,000',Math.min(100,rev/10000*100))}${mile('100 orders',orders>=100,orders+' / 100 orders',Math.min(100,orders))}</div></section><section class="personal-grid"><div class="personal-card"><h2>♡ My Personal Space</h2><div class="kicker">TODAY’S AFFIRMATION</div><p class="quote">“${affirmations[d%affirmations.length]}”</p><button class="btn" onclick="render('manifest')">Open manifestation journal</button></div><div class="personal-card"><h2>☑ My To-Do List</h2><div id="homeTasks"></div><div class="inline-add"><input id="homeTaskInput" placeholder="Add a task…"><button class="btn primary" onclick="addTaskFromHome()">Add</button></div><p class="section-note">You add your tasks; SEREA can also suggest simple business reminders.</p></div><div class="personal-card"><h2>✧ My Goals</h2><div id="homeGoals"></div><button class="btn" onclick="render('goals')">View my goals</button></div><div class="personal-card"><h2>☼ Ideas & Tips</h2><p>${ideas[idx]}</p><button class="btn" onclick="render('ideas')">See more ideas</button></div></section><p class="notice">Your imported workbook records are kept on this device. Please download a backup regularly.</p>`}
function mile(label,done,note,pct=done?100:0){return `<div class="milestone"><span class="dot ${done?'done':''}"></span><div class="miletext"><b>${label}</b><small>${note}</small><div class="progress"><i style="width:${pct}%"></i></div></div></div>`}
function pageHead(title,desc,action=''){return `<div class="pagehead"><div><h2>${title}</h2><div class="muted">${desc}</div></div>${action}</div>`}
function btn(label,type){return `<button class="btn primary" onclick="openForm('${type}')">＋ ${label}</button>`}
function products(){return pageHead('Products & Costing','Manage products, recipe materials, unit cost and selling prices.',btn('Add product','product')+' '+btn('Add costing item','recipe'))+`<div class="card" style="margin-bottom:12px"><h2>Product costing guide</h2><p class="muted">Add one recipe line per material used in one finished product. The website totals the saved recipe lines below.</p></div>`+sectionTable(['Product','Category','Status','SRP','Recipe Cost','Profit / Piece'],db.products.map(p=>{let n=pname(p),c=recipeCost(n);return `<tr><td><b>${clean(n)}</b></td><td>${clean(get(p,'Category'))}</td><td><span class="pill">${clean(get(p,'Status')||'Active')}</span></td><td>${money(srp(n))}</td><td>${money(c)}</td><td class="${srp(n)-c>=0?'positive':'negative'}">${money(srp(n)-c)}</td></tr>`}).join(''))}
function materials(){return pageHead('Raw Materials','Track ingredients, packaging, and unit costs.',btn('Add material','material'))+sectionTable(['Material','Type','Unit','Opening Qty','Unit Cost','Current Qty','Stock Value'],db.materials.map(m=>`<tr><td><b>${clean(mname(m))}</b></td><td>${clean(get(m,'Material Type'))}</td><td>${clean(get(m,'Unit'))}</td><td>${num(get(m,'Opening Qty'))}</td><td>${money(get(m,'Opening Cost / Unit (₱)'))}</td><td>${num(get(m,'Current Qty')||get(m,'Opening Qty'))}</td><td>${money(num(get(m,'Current Qty')||get(m,'Opening Qty'))*num(get(m,'Opening Cost / Unit (₱)')))}</td></tr>`).join(''))}
function purchases(){return pageHead('Purchases','Purchase history and supplier payments.',btn('Add purchase','purchase'))+sectionTable(['Date','Supplier','Material','Qty Packs','Units / Pack','Cost / Pack','Total','Paid','Add to Stock'],db.purchases.map(p=>`<tr><td>${clean(get(p,'Purchase Date'))}</td><td>${clean(get(p,'Supplier'))}</td><td>${clean(get(p,'Material Name'))}</td><td>${num(get(p,'Qty (Packs)'))}</td><td>${num(get(p,'Units per Pack'))}</td><td>${money(get(p,'Cost per Pack (₱)'))}</td><td>${money(get(p,'Total Purchase (₱)'))}</td><td>${money(get(p,'Amount Paid (₱)'))}</td><td>${clean(get(p,'Add to Live Stock?'))}</td></tr>`).join(''))}
function inventory(){let rows=db.materials.map(m=>{let q=num(get(m,'Current Qty')||get(m,'Opening Qty')),min=num(get(m,'Minimum Stock'));return `<tr><td><b>${clean(mname(m))}</b></td><td>${clean(get(m,'Material Type'))}</td><td>${clean(get(m,'Unit'))}</td><td>${q}</td><td>${min||'—'}</td><td>${money(get(m,'Opening Cost / Unit (₱)'))}</td><td class="${min>0&&q<=min?'stock-low':'stock-ok'}">${min>0&&q<=min?'Low stock':'In stock'}</td></tr>`}).join('');let buys=db.purchases.slice().reverse().map(p=>`<tr><td>${clean(get(p,'Purchase Date'))}</td><td>${clean(get(p,'Material Name'))}</td><td>${num(get(p,'Qty (Packs)'))*num(get(p,'Units per Pack'))} ${clean(get(p,'Stock Unit'))}</td><td>${money(get(p,'Total Purchase (₱)'))}</td><td>${clean(get(p,'Add to Live Stock?'))}</td></tr>`).join('');return pageHead('Inventory','Raw materials, current quantities, low-stock alerts and purchase history.',btn('Add material','material')+' '+btn('Record purchase','purchase'))+`<div class="card" style="margin-bottom:13px"><h2>My Stocks</h2>${sectionTable(['Material','Type','Unit','Current Qty','Min. Level','Unit Cost','Status'],rows)}</div><div class="card"><h2>Purchase History</h2>${sectionTable(['Date','Material','Qty Added','Total Cost','Added to Stock'],buys)}</div>`}
function production(){return pageHead('Production','Record finished batches and production notes.',btn('Log production','production'))+sectionTable(['Date','Product','Qty Made','Packaging','Batch Cost','Notes'],db.production.map(p=>`<tr><td>${clean(get(p,'Production Date'))}</td><td>${clean(get(p,'Product Name'))}</td><td>${num(get(p,'Qty Produced'))}</td><td>${clean(get(p,'Packaging Option'))}</td><td>${money(get(p,'Batch Cost (₱)'))}</td><td>${clean(get(p,'Notes'))}</td></tr>`).join(''))}
function sales(){return pageHead('Orders','Track customer orders, payment collections, and status.',btn('Add sale / order','sale'))+sectionTable(['Date','Customer','Product','Qty','Revenue','Collected','Gross Profit','Stage'],db.sales.map(s=>{let n=get(s,'Product Name'),r=num(get(s,'Sales Revenue (₱)'))||num(get(s,'Qty Sold'))*srp(n),c=num(get(s,'COGS (₱)'))||num(get(s,'Qty Sold'))*recipeCost(n);return `<tr><td>${clean(get(s,'Sale Date'))}</td><td>${clean(get(s,'Customer'))}</td><td>${clean(n)}</td><td>${num(get(s,'Qty Sold'))}</td><td>${money(r)}</td><td>${money(get(s,'Amount Collected (₱)'))}</td><td>${money(r-c)}</td><td><span class="pill">${clean(get(s,'Stage')||get(s,'Payment Status ')||'Completed')}</span></td></tr>`}).join(''))}
function expensesPage(){return pageHead('Expenses','Review cash outflows and add business expenses.',btn('Add expense','cash'))+sectionTable(['Date','Description','Category','Method','Amount'],db.cash.filter(c=>get(c,'Direction')==='Out').map(c=>`<tr><td>${clean(get(c,'Date'))}</td><td>${clean(get(c,'Description'))}</td><td>${clean(get(c,'Category'))}</td><td>${clean(get(c,'Payment Method'))}</td><td>${money(get(c,'Amount (₱)'))}</td></tr>`).join(''))}
function reports(){let rev=revenue(),cogs=sum(db.sales,s=>num(get(s,'COGS (₱)'))||num(get(s,'Qty Sold'))*recipeCost(get(s,'Product Name'))),cashIn=sum(db.sales,s=>num(get(s,'Amount Collected (₱)')));return pageHead('Reports','A quick summary from your recorded business data.')+`<section class="metrics">${metric('Revenue',money(rev),'Sales value','↗')}${metric('Product Costs',money(cogs),'Recorded or estimated COGS','◇')}${metric('Gross Profit',money(rev-cogs),'Revenue less product costs','✧')}${metric('Cash Collected',money(cashIn),'Customer payments received','₱')}${metric('Expenses',money(expenses()),'Recorded cash outflows','−')}</section>`+`<div class="card"><h2>Product profitability</h2>${sectionTable(['Product','SRP','Recipe Cost','Contribution','Margin'],db.products.map(p=>{let n=pname(p),r=srp(n),c=recipeCost(n);return `<tr><td>${clean(n)}</td><td>${money(r)}</td><td>${money(c)}</td><td>${money(r-c)}</td><td>${r?((r-c)/r*100).toFixed(1)+'%':'—'}</td></tr>`}).join(''))}</div>`}
function planner(){return pageHead('Business Planner','A simple weekly focus for growing SEREA.')+`<div class="card"><h2>This week’s focus</h2><div class="formgrid"><div class="field"><label>Sales goal (₱)</label><input id="planSales" type="number" value="5000"></div><div class="field"><label>Marketing goal</label><input id="planMarketing" value="Post 3 product videos"></div><div class="field"><label>Operations goal</label><input id="planOps" value="Prepare next production batch"></div></div><button class="btn primary" style="margin-top:13px" onclick="savePlan()">Save weekly plan</button><div id="planStatus" class="notice"></div></div><div class="card" style="margin-top:13px"><h2>Weekly reminder</h2><p class="muted">Review your orders, check low materials, plan production, and look at your best-performing products once a week.</p></div>`}
function goals(){return pageHead('Goals & Milestones','Celebrate progress and keep your targets visible.')+`<div class="card"><h2>Business milestones</h2>${mile('First sale',db.sales.length>0,db.sales.length?'First sale recorded':'Waiting for your first sale')}${mile('10 orders',db.sales.length>=10,db.sales.length+' / 10 orders',Math.min(100,db.sales.length*10))}${mile('₱10,000 revenue',revenue()>=10000,money(revenue())+' / ₱10,000',Math.min(100,revenue()/10000*100))}${mile('100 orders',db.sales.length>=100,db.sales.length+' / 100 orders',Math.min(100,db.sales.length))}</div>`}
function ideasPage(){return pageHead('Ideas & Growth','Small, practical ideas to help SEREA grow.')+`<div class="metrics">${ideas.slice(0,3).map((x,i)=>`<div class="card" style="grid-column:span 1"><div class="kicker">IDEA ${i+1}</div><p>${x}</p></div>`).join('')}</div><div class="card"><h2>Simple growth habits</h2><p>• Share real product photos consistently.</p><p>• Ask customers what scents and gift styles they prefer.</p><p>• Track which products bring the best contribution per piece.</p><p>• Plan production around confirmed orders and realistic stock.</p></div>`}

function readPersonal(key,fallback){try{return JSON.parse(localStorage.getItem('serea_personal_'+key))??fallback}catch{return fallback}}
function writePersonal(key,val){localStorage.setItem('serea_personal_'+key,JSON.stringify(val))}
function renderHomeTasks(){let tasks=readPersonal('tasks',[]);let el=$('homeTasks');if(el)el.innerHTML=tasks.slice(0,4).map((t,i)=>`<label class="taskrow"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i},this.checked)"><span style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${clean(t.text)}</span></label>`).join('')||'<p class="muted">No tasks yet. Add your first task.</p>';let g=$('homeGoals');if(g){let goals=readPersonal('goals',[{text:'Grow SEREA steadily',progress:0}]);g.innerHTML=goals.slice(0,2).map(x=>`<p><b>${clean(x.text)}</b><div class="progress"><i style="width:${Math.min(100,Math.max(0,num(x.progress)))}%"></i></div><small class="muted">${num(x.progress)}% complete</small></p>`).join('')}}
function addTaskFromHome(){let el=$('homeTaskInput');if(!el||!el.value.trim())return;let a=readPersonal('tasks',[]);a.push({text:el.value.trim(),done:false});writePersonal('tasks',a);renderHomeTasks();el.value=''}
function toggleTask(i,v){let a=readPersonal('tasks',[]);if(a[i])a[i].done=v;writePersonal('tasks',a);renderHomeTasks()}
function todoPage(){let tasks=readPersonal('tasks',[]);return pageHead('My To-Do List','Your tasks, your pace.')+`<div class="card"><h2>My tasks</h2>${tasks.map((t,i)=>`<label class="taskrow"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i},this.checked);render('todo')"><span style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${clean(t.text)}</span></label>`).join('')||'<p class="muted">No tasks yet.</p>'}<div class="inline-add"><input id="todoInput" placeholder="What do you need to do?"><button class="btn primary" onclick="addTodoPage()">Add task</button></div></div><div class="card" style="margin-top:12px"><h2>Suggested business reminders</h2><p class="muted">Suggestions only — you decide whether to add them to your list.</p><button class="btn" onclick="suggestTask('Check raw material stocks')">+ Check raw material stocks</button> <button class="btn" onclick="suggestTask('Review product costing')">+ Review product costing</button> <button class="btn" onclick="suggestTask('Review this week’s orders')">+ Review orders</button></div>`}
function addTodoPage(){let e=$('todoInput');if(e&&e.value.trim()){let a=readPersonal('tasks',[]);a.push({text:e.value.trim(),done:false});writePersonal('tasks',a);render('todo')}}
function suggestTask(t){let a=readPersonal('tasks',[]);a.push({text:t,done:false});writePersonal('tasks',a);render('todo')}
function manifestPage(){let m=readPersonal('manifest',{dreams:'',gratitude:'',intention:''});return pageHead('Manifestation & Affirmations','A little space for your intentions, dreams, and gratitude.')+`<div class="personal-grid"><div class="personal-card"><h2>♡ Daily affirmation</h2><p class="quote">“${affirmations[dayCount()%affirmations.length]}”</p></div><div class="personal-card"><h2>✧ A reminder</h2><p class="quote">Small steps count. You are allowed to grow at your own pace.</p></div></div><div class="card" style="margin-top:12px"><h2>My manifestation journal</h2><div class="field"><label>What am I working towards?</label><textarea id="dreams">${clean(m.dreams)}</textarea></div><div class="field" style="margin-top:10px"><label>What am I grateful for?</label><textarea id="gratitude">${clean(m.gratitude)}</textarea></div><div class="field" style="margin-top:10px"><label>My intention this week</label><textarea id="intention">${clean(m.intention)}</textarea></div><button class="btn primary" style="margin-top:12px" onclick="saveManifest()">Save my journal</button><span id="manifestStatus" class="notice"></span></div>`}
function saveManifest(){writePersonal('manifest',{dreams:$('dreams').value,gratitude:$('gratitude').value,intention:$('intention').value});$('manifestStatus').textContent='Saved on this device.'}

function soundsPage(){const items=[['Money & Abundance','Uplifting, gentle ambient tones for setting a positive money mindset.','money'],['Peace & Calm','Soft, slow ambient sound for a quiet moment.','peace'],['Focus & Productivity','A steady, unobtrusive tone bed for planning and work.','focus'],['432 Hz / 528 Hz','Optional frequency-inspired listening. These tones are not proven to attract money or guarantee outcomes.','frequency']];return pageHead('SEREA Soundscape','A little atmosphere for your goals, peace, and work.')+`<div class="card" style="margin-bottom:12px"><h2>Background sound</h2><p class="muted">Turn it on or off anytime using the Music button at the top. iPhone browsers require a tap before audio can start.</p><div class="sound-grid">${items.map(([title,desc,key])=>`<div class="sound-card"><h3>♫ ${title}</h3><p>${desc}</p><button class="btn" onclick="setSoundMood('${key}')">Choose this mood</button></div>`).join('')}</div><p class="sound-note">This is an original, gentle synthesized soundscape generated by the website—not a commercial song or playlist. Frequency-based listening is a personal preference, not a scientifically established money magnet.</p></div><div class="card"><h2>Your listening ritual</h2><p class="quote">Take a breath. Set an intention. Then take one small practical step toward it.</p><button class="btn primary" onclick="toggleMusic()">♫ <span id="soundPageState">Turn music on / off</span></button></div>`}
const renderers={dashboard,products,materials:inventory,purchases,inventory,production,sales,expenses:expensesPage,reports,planner,goals,ideas:ideasPage,manifest:manifestPage,todo:todoPage,sounds:soundsPage};
function render(p){current=p;$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('content').innerHTML=renderers[p]();if(p==='dashboard')renderHomeTasks();}
function searchAll(q){if(!q.trim())return;let results=[...db.products.map(x=>({kind:'Product',name:pname(x)})),...db.materials.map(x=>({kind:'Material',name:mname(x)}))].filter(x=>String(x.name).toLowerCase().includes(q.toLowerCase())).slice(0,12);let html=pageHead('Search results',`${results.length} matches for “${clean(q)}”`)+sectionTable(['Type','Name'],results.map(x=>`<tr><td>${x.kind}</td><td>${clean(x.name)}</td></tr>`).join(''));$('content').innerHTML=html;}
function field(label,name,type='text',value='',opts=null){return `<div class="field"><label>${label}</label>${opts?`<select name="${name}">${opts.map(o=>`<option>${clean(o)}</option>`).join('')}</select>`:`<input name="${name}" type="${type}" value="${clean(value)}" ${type==='number'?'step="any"':''}>`}</div>`}
function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
function openForm(type){let html='',title='';if(type==='recipe'){title='Add material to product costing';html=`<form class="formgrid" onsubmit="submitRecipe(event)">${field('Product','Product Name','text','',db.products.map(pname))}${field('Material','Material Name','text','',db.materials.map(mname))}${field('Quantity used per product','Qty per Product','number','0')}${field('Unit cost (₱)','Unit Cost (₱)','number','0')}${field('Buffer (%)','Buffer %','number','0')}<button class="btn primary">Save costing line</button></form>`}if(type==='product'){title='Add product';html=`<form class="formgrid" onsubmit="submitRecord(event,'products')">${field('Product name','Product Name')}${field('Category','Category','text','Candle')}${field('Status','Status','text','Active')}${field('SRP (₱)','SRP','number','0')}<button class="btn primary">Save product</button></form>`}if(type==='material'){title='Add raw material';html=`<form class="formgrid" onsubmit="submitRecord(event,'materials')">${field('Material name','Material Name')}${field('Type','Material Type','text','Raw Material')}${field('Unit','Unit','text','g')}${field('Opening quantity','Opening Qty','number','0')}${field('Minimum stock alert','Minimum Stock','number','0')}${field('Cost per unit (₱)','Opening Cost / Unit (₱)','number','0')}<button class="btn primary">Save material</button></form>`}if(type==='purchase'){title='Add purchase';html=`<form class="formgrid" onsubmit="submitPurchase(event)">${field('Purchase date','Purchase Date','date',new Date().toISOString().slice(0,10))}${field('Supplier','Supplier')}${field('Material','Material Name','text','',db.materials.map(mname))}${field('Category','Category','text','Raw Material')}${field('Quantity (packs)','Qty (Packs)','number','1')}${field('Units per pack','Units per Pack','number','1')}${field('Stock unit','Stock Unit','text','g')}${field('Cost per pack (₱)','Cost per Pack (₱)','number','0')}${field('Amount paid (₱)','Amount Paid (₱)','number','0')}${field('Add purchased quantity to stock?','Add to Live Stock?','text','Yes',['Yes','No'])}<button class="btn primary">Save purchase</button></form>`}if(type==='production'){title='Log production';html=`<form class="formgrid" onsubmit="submitRecord(event,'production')">${field('Production date','Production Date','date',new Date().toISOString().slice(0,10))}${field('Product','Product Name','text','',db.products.map(pname))}${field('Quantity produced','Qty Produced','number','1')}${field('Packaging option','Packaging Option')}${field('Batch cost (₱)','Batch Cost (₱)','number','0')}${field('Notes','Notes')}<button class="btn primary">Save batch</button></form>`}if(type==='sale'){title='Add sale / order';html=`<form class="formgrid" onsubmit="submitSale(event)">${field('Sale date','Sale Date','date',new Date().toISOString().slice(0,10))}${field('Customer','Customer')}${field('Product','Product Name','text','',db.products.map(pname))}${field('Quantity sold','Qty Sold','number','1')}${field('Amount collected (₱)','Amount Collected (₱)','number','0')}${field('Order status','Stage','text','Order Received',['Order Received','On Production','Ready','Delivered','Fully Paid'])}${field('Notes','Notes')}<button class="btn primary">Save order</button></form>`}if(type==='cash'){title='Add expense / cash entry';html=`<form class="formgrid" onsubmit="submitRecord(event,'cash')">${field('Date','Date','date',new Date().toISOString().slice(0,10))}${field('Description','Description')}${field('Category','Category','text','Operating Expense',['Owner Capital','Other Income','Operating Expense','Tax','Owner Withdrawal','Other'])}${field('Direction','Direction','text','Out',['In','Out'])}${field('Payment method','Payment Method','text','Cash',['Cash','Bank','E-wallet','Other'])}${field('Amount (₱)','Amount (₱)','number','0')}<button class="btn primary">Save entry</button></form>`}modal(title,html)}
function submitRecipe(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());o['Qty per Product']=num(o['Qty per Product']);o['Unit Cost (₱)']=num(o['Unit Cost (₱)']);o['Buffer %']=num(o['Buffer %'])/100;o['Cost per Product Line (₱)']=o['Qty per Product']*o['Unit Cost (₱)']*(1+o['Buffer %']);db.recipes.push(o);save();closeModal();render('products')}
function submitRecord(e,k){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());for(let f in o)if(['SRP','Opening Qty','Opening Cost / Unit (₱)','Qty Produced','Batch Cost (₱)','Amount (₱)'].includes(f))o[f]=num(o[f]);db[k].push(o);save();closeModal();render(current)}
function submitPurchase(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());['Qty (Packs)','Units per Pack','Cost per Pack (₱)','Amount Paid (₱)'].forEach(k=>o[k]=num(o[k]));o['Total Purchase (₱)']=o['Qty (Packs)']*o['Cost per Pack (₱)'];db.purchases.push(o);if(o['Add to Live Stock?']==='Yes'){let m=db.materials.find(x=>mname(x)===o['Material Name']);if(m){let add=o['Qty (Packs)']*o['Units per Pack'];m['Current Qty']=num(get(m,'Current Qty')||get(m,'Opening Qty'))+add;m['Opening Cost / Unit (₱)']=add>0?o['Cost per Pack (₱)']/o['Units per Pack']:num(get(m,'Opening Cost / Unit (₱)'));}}save();closeModal();render(current)}
function submitSale(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());o['Qty Sold']=num(o['Qty Sold']);o['Amount Collected (₱)']=num(o['Amount Collected (₱)']);o['Sales Revenue (₱)']=o['Qty Sold']*srp(o['Product Name']);o['COGS (₱)']=o['Qty Sold']*recipeCost(o['Product Name']);o['Gross Profit (₱)']=o['Sales Revenue (₱)']-o['COGS (₱)'];o['Payment Status ']=o['Amount Collected (₱)']===0?'Unpaid':o['Amount Collected (₱)']<o['Sales Revenue (₱)']?'Partial':'Fully Paid';db.sales.push(o);save();closeModal();render(current)}
function savePlan(){localStorage.setItem('serea_weekly_plan',JSON.stringify({sales:$('planSales').value,marketing:$('planMarketing').value,ops:$('planOps').value}));$('planStatus').textContent='Weekly plan saved on this device.'}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='serea-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}

let audioCtx=null,masterGain=null,musicOn=localStorage.getItem('serea_music_on')!=='false',musicStarted=false,mood='peace',oscillators=[];
function updateMusicUI(){let b=$('musicToggle'),t=$('musicState');if(b){b.classList.toggle('playing',musicOn&&musicStarted);t.textContent=musicOn?(musicStarted?'Music ON':'Music ON · Tap'):'Music OFF';}let p=$('soundPageState');if(p)p.textContent=musicOn?'Music is ON':'Music is OFF';}
function startSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();if(musicStarted){if(masterGain)masterGain.gain.setTargetAtTime(musicOn?0.055:0,audioCtx.currentTime,0.25);return;}masterGain=audioCtx.createGain();masterGain.gain.value=0;masterGain.connect(audioCtx.destination);let freqs=mood==='money'?[220,329.63,440]:mood==='frequency'?[216,264,396]:mood==='focus'?[174.61,220,261.63]:[196,246.94,293.66];freqs.forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=[0.25,0.18,0.12][i];o.connect(g);g.connect(masterGain);o.start();oscillators.push(o)});masterGain.gain.setTargetAtTime(musicOn?0.055:0,audioCtx.currentTime,0.8);musicStarted=true;updateMusicUI();}catch(e){console.warn('Audio unavailable',e)}}
function toggleMusic(){musicOn=!musicOn;localStorage.setItem('serea_music_on',String(musicOn));if(musicOn)startSound();else if(masterGain&&audioCtx)masterGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.2);updateMusicUI();}
function setSoundMood(m){mood=m;if(musicStarted){oscillators.forEach(o=>{try{o.stop()}catch(e){}});oscillators=[];musicStarted=false;}musicOn=true;localStorage.setItem('serea_music_on','true');startSound();updateMusicUI();}
init();updateMusicUI();
</script></body></html>
