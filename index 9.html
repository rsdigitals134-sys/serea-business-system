const KEY='serea_simple_v1';const SUPABASE_URL='https://bxyegvfjdeoeppitiofe.supabase.co';const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4eWVndmZqZGVvZXBwaXRpb2ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyOTEzNzksImV4cCI6MjExMDg2NzM3OX0.vYRJsLYeoQgwSn8ENzCxA1Btx7zlxqSq3bA-ovkhQuY';const PUBLIC_PORTFOLIO_URL='https://rsdigitals134-sys.github.io/serea-business-system/?portfolio=public';const STATUSES=['Order Received','On Production','Ready','Delivered','Paid'];const affirmations=['I am building something meaningful, one step at a time.','I welcome steady growth, creativity, and abundance.','I trust myself to learn and improve as I go.','My work has value, and I deserve to grow.'];
function readOld(k){try{return JSON.parse(localStorage.getItem('serea_'+k)||'[]')}catch{return []}}function loadData(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d)return d}catch{}let oldP=readOld('products'),oldS=readOld('sales'),oldR=readOld('recipes');let products=oldP.map(p=>{let n=p['Product Name']||p.name;let cost=0;oldR.filter(r=>r['Product Name']===n).forEach(r=>cost+=Number(r['Cost per Product Line (₱)']||0));return {id:uid(),name:n,cost:Number(p['Manual Cost']||cost||0),srp:Number(p.SRP||0)}});let orders=oldS.map(s=>({id:uid(),date:s['Sale Date']||todayISO(),customer:s.Customer||'',product:s['Product Name']||'',qty:Number(s['Qty Sold']||0),total:Number(s['Sales Revenue (₱)']||((Number(s['Qty Sold']||0))*(Number((products.find(p=>p.name===(s['Product Name']||''))||{}).srp||0)))),paid:Number(s['Amount Collected (₱)']||0),status:STATUSES.includes(s.Stage)?s.Stage:(['Fully Paid','Completed'].includes(s.Stage)?'Paid':s.Stage||'Order Received'),notes:s.Notes||''}));return {products,orders,tasks:[]}}
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}let db=loadData();db.portfolio=Array.isArray(db.portfolio)?db.portfolio:[];function persist(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}function todayISO(){return new Date().toISOString().slice(0,10)}function dateText(s){return s?new Date(s+'T00:00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}):'—'}function activeOrders(){return db.orders.filter(o=>o.status!=='Paid')}function pendingTasks(){return db.tasks.filter(t=>!t.done)}function nav(page){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('content').innerHTML=({home,products,portfolio,orders,reports,space,todo,sounds,tips})[page]();}
let calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),calSelected=todayISO();function dueOrders(date){return db.orders.filter(o=>o.dueDate===date)}function calendarHTML(){let y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),cells='';let names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];cells=names.map(n=>`<div class="cal-week">${n}</div>`).join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,list=dueOrders(iso),isToday=iso===todayISO(),selected=iso===calSelected;let marker=list.length?'<i></i>':'';cells+=`<button class="cal-day ${isToday?'today':''} ${selected?'selected':''}" onclick="selectCalDay('${iso}')">${d}<span class="dots">${marker}</span></button>`}let selectedOrders=dueOrders(calSelected);return `<section class="calendar-card"><div class="cal-head"><div><div class="kicker">✧ Working calendar</div><h2>${calMonth.toLocaleDateString('en-PH',{month:'long',year:'numeric'})}</h2></div><div class="cal-nav"><button onclick="changeCal(-1)">‹</button><button onclick="changeCal(1)">›</button></div></div><div class="cal-grid">${cells}</div><div class="cal-legend"><span><i style="background:#8750c4"></i> Delivery deadline</span></div><div class="cal-details"><b>${dateText(calSelected)} · ${selectedOrders.length} ${selectedOrders.length===1?'order':'orders'}</b>${selectedOrders.map(o=>`<p>• ${esc(o.customer||'Customer')} — ${esc(o.product)} (${o.qty}) <span class="pill">${esc(o.status)}</span></p>`).join('')||'<p class="muted">No delivery deadlines on this date.</p>'}</div></section>`}
function changeCal(n){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1);nav('home')}function selectCalDay(d){calSelected=d;nav('home')}
const navItems=[['home','⌂','Home'],['products','◇','Products'],['orders','▥','Orders'],['portfolio','▣','Portfolio'],['reports','▧','Reports'],['tips','✦','Tips'],['space','♡','My Space'],['todo','☑','To-Do'],['sounds','♫','Sounds']];async function renderPublicPortfolio(){document.body.innerHTML=`<main style="max-width:1100px;margin:auto;padding:32px 18px 60px"><header style="text-align:center;padding:24px 0 32px"><div style="font:700 38px Georgia,serif;letter-spacing:7px;color:var(--pd)">SEREA</div><div style="font-size:10px;letter-spacing:3px;color:var(--muted)">HAND-POURED WITH LOVE</div><div class="kicker" style="margin-top:26px">THE COLLECTION</div><h1 style="font:700 clamp(28px,5vw,42px) Georgia,serif;color:var(--pd);margin:8px 0">Our Product Portfolio</h1><p class="muted" style="max-width:540px;margin:auto">A little collection of thoughtfully made pieces. Browse our products and their current prices below.</p></header><section id="publicGallery" class="portfolio-grid"><div class="portfolio-empty" style="grid-column:1/-1">Loading the SEREA collection…</div></section><footer style="text-align:center;color:var(--muted);font-size:11px;margin-top:36px"><b style="color:var(--pd);letter-spacing:2px">SEREA</b><br>Thank you for supporting our small business. 💜</footer></main>`;const gallery=document.getElementById('publicGallery');try{const r=await fetch(SUPABASE_URL+'/rest/v1/serea_public_portfolio?select=id,product_name,price,caption,image_path,display_order,updated_at&order=display_order.asc,updated_at.desc',{headers:{apikey:SUPABASE_ANON,Authorization:'Bearer '+SUPABASE_ANON}});if(!r.ok)throw new Error('Could not load the collection.');const rows=await r.json();if(!rows.length){gallery.innerHTML='<div class="portfolio-empty" style="grid-column:1/-1">Our collection is being prepared. Please check back soon. 💜</div>';return}gallery.innerHTML='';rows.forEach(x=>{const card=document.createElement('article');card.className='portfolio-item';const img=document.createElement('img');img.loading='lazy';img.alt=x.product_name;img.src=SUPABASE_URL+'/storage/v1/object/public/serea-public-portfolio/'+encodeURIComponent(x.image_path);const info=document.createElement('div');info.className='portfolio-info';const name=document.createElement('h3');name.textContent=x.product_name;const price=document.createElement('b');price.style.color='var(--pd)';price.textContent=money(x.price);info.append(name,price);if(x.caption){const cap=document.createElement('p');cap.style.marginTop='7px';cap.textContent=x.caption;info.append(cap)}card.append(img,info);gallery.append(card)})}catch(err){gallery.innerHTML='<div class="portfolio-empty" style="grid-column:1/-1">We could not load the portfolio right now. Please refresh and try again.</div>'}}
function init(){if(new URLSearchParams(location.search).get('portfolio')==='public'){renderPublicPortfolio();return}let d=new Date();document.getElementById('today').textContent=d.toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',year:'numeric'});document.getElementById('greeting').textContent=(d.getHours()<12?'Good morning':d.getHours()<18?'Good afternoon':'Good evening')+'! 💜';document.getElementById('nav').innerHTML=navItems.map(([id,ic,l])=>`<button data-page="${id}" onclick="nav('${id}')"><span class="ico">${ic}</span>${l}</button>`).join('');nav('home');musicUI()}

const businessTips=[
['Pricing','Know your cost before setting a price. Include wax, fragrance, containers, labels, packaging, and a fair allowance for your time.','Review the cost and SRP of one product today.'],
['Product photos','Use natural light near a window and a simple background. Keep the candle itself true to its actual color and finish.','Take one clear photo of a best-selling product.'],
['Customer care','Confirm the scent, quantity, packaging, delivery date, and spelling of gift messages before accepting an order.','Send a clear order confirmation to your next customer.'],
['Planning','Set a realistic production lead time and leave a little buffer for curing, packing, and unexpected delays.','Check the next seven days for delivery deadlines.'],
['Cash flow','Sales are not the same as profit. Set aside the amount needed to replace materials before treating the rest as available income.','Record any business expense you made today.'],
['Repeat customers','A warm thank-you message after delivery helps customers feel appreciated without pressuring them to buy again.','Prepare a short thank-you message for completed orders.'],
['Content','Show the making process, packaging details, and the finished candle. Helpful behind-the-scenes content builds trust.','Record a 10-second clip of one step in your process.'],
['Inventory basics','Even without a detailed stock system, keep a short note of materials that are running low so you can reorder in time.','Write down the three materials you need to replenish soon.'],
['Order management','Keep customer requests and delivery dates in one place. Avoid relying only on chat messages that can get buried.','Check that every active order has a delivery date.'],
['Product quality','Test a new scent or wick choice in a small batch before offering it widely. Keep notes so you can repeat good results.','Write down one observation from your latest candle batch.'],
['Packaging','Choose packaging that protects the candle and suits the occasion. A neat, consistent finish can make a simple gift feel special.','Check one packed order for presentation and protection.'],
['Marketing','Describe the feeling, scent profile, and occasion for a candle instead of only listing its ingredients.','Write one sentence describing who would love one of your candles.'],
['Focus','You do not need to do everything in one day. Pick one task that directly helps a customer or improves the business.','Choose your most important business task and finish it first.'],
['Customer feedback','Ask a simple, optional question after delivery: “How did you like the candle and its scent?” Use feedback to improve.','Invite one recent customer to share feedback.'],
['Offers','Discounts should still leave room for costs and profit. Consider bundles or add-ons instead of reducing every product price.','Check the profit on any promotion before posting it.'],
['Brand consistency','Use the same logo, colors, tone, and product naming across your posts and order confirmations.','Check that your latest post follows SEREA’s visual style.'],
['Time management','Group similar tasks—such as pouring, labeling, or packing—to reduce setup time and make work feel more manageable.','Group tomorrow’s tasks into one small batch.'],
['Business records','Save order details and payment updates as soon as they happen. Small, regular updates are easier than catching up later.','Update the status of any order that has moved forward.'],
['Scent descriptions','Help customers imagine a scent with familiar notes and a mood, while being honest about how the fragrance actually smells.','Improve one scent description in your product listing.'],
['Growth','Before adding many new products, learn which existing products customers ask for and reorder most often.','Look at your recent orders and note your most requested product.'],
['Boundaries','Clear order cut-off times, payment terms, and cancellation policies help protect both you and your customers.','Make sure your order terms are easy for customers to understand.'],
['Profit','A product with many orders is not automatically the most profitable. Compare its selling price with its manual material cost.','Compare profit per piece for two products.'],
['Customer experience','Reply with a friendly, clear message. If you need time to confirm something, tell the customer when you will get back to them.','Prepare a reusable reply for common customer questions.'],
['Launching','Introduce a new product with clear photos, price, size, scent options, and ordering instructions.','List the details a customer needs before ordering your next launch.'],
['Rest','A sustainable business needs a sustainable pace. Plan breaks and avoid promising delivery dates you cannot comfortably meet.','Choose a realistic stopping time for today.'],
['Product descriptions','Include size, burn-care guidance, scent, and packaging details so customers know what they are ordering.','Review one product description for missing details.'],
['Delivery','Confirm the delivery address and preferred receiving time before dispatch to reduce avoidable delivery issues.','Double-check the details for your next delivery.'],

function tips(){let now=new Date(),start=new Date(now.getFullYear(),0,0),day=Math.floor((now-start)/86400000),tip=businessTips[(day-1)%businessTips.length];return pageHead('Daily Business Tips','Small, practical ideas to help SEREA grow—one day at a time.')+`<section class="tip-hero"><div class="tip-kicker">✦ TIP OF THE DAY · ${now.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div><div class="tip-number">${String((day-1)%businessTips.length+1).padStart(2,'0')}</div><div class="tip-category">${tip[0]}</div><p class="tip-copy">${tip[1]}</p><div class="tip-action"><span>♡ TODAY’S SMALL ACTION</span><b>${tip[2]}</b></div><p class="tip-note">Your tip changes automatically each day. Come back tomorrow for a fresh idea. 💜</p></section><div class="card tip-foot"><h2>A gentle reminder</h2><p class="quote">You don’t have to do everything today. A small step that you can repeat is still progress.</p></div>`}
function pageHead(t,d,a=''){return `<div class="pagehead"><div><h2>${t}</h2><div class="muted">${d}</div></div>${a}</div>`}function action(label,fn){return `<button class="btn primary" onclick="${fn}">＋ ${label}</button>`}
function home(){let rev=db.orders.reduce((a,o)=>a+Number(o.total||0),0),profit=db.orders.reduce((a,o)=>a+(Number(o.total||0)-Number((db.products.find(p=>p.name===o.product)||{}).cost||0)*Number(o.qty||0)),0);let day=Math.max(1,Math.floor((Date.now()-new Date('2026-11-02T00:00:00').getTime())/86400000)+1);return `<section class="hero"><div class="journey"><div class="kicker">✦ SEREA business journey</div><div class="day">DAY ${String(day).padStart(2,'0')}</div><div class="muted">Since November 2, 2026</div><p class="quote">You are building something meaningful. Keep going. 💜</p></div><div class="daily"><div class="dailycard"><div class="kicker">♡ Today · ${new Date().toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric'})}</div><p>“${affirmations[day%affirmations.length]}”</p></div><div class="dailycard"><div class="kicker">✧ A gentle reminder</div><p>One order, one customer, one small step at a time.</p></div></div></section><section class="card"><h2>Priority</h2><div class="priority-grid"><button class="priority-tile" onclick="nav('orders')"><span>📦</span><b>Orders Priority</b><strong>${activeOrders().length}</strong><small>Orders needing action · View ↗</small></button><button class="priority-tile" onclick="nav('todo')"><span>☑</span><b>To-Do Priority</b><strong>${pendingTasks().length}</strong><small>Tasks not yet completed · View ↗</small></button></div>${!activeOrders().length&&!pendingTasks().length?'<p class="muted" style="margin:12px 0 0">You’re all caught up! 💜</p>':''}</section>${calendarHTML()}<section class="metrics"><div class="metric"><span>Total Orders</span><strong>${db.orders.length}</strong></div><div class="metric"><span>Recorded Sales</span><strong>${money(rev)}</strong></div><div class="metric"><span>Estimated Profit</span><strong>${money(profit)}</strong></div></section><section class="personal-grid"><div class="personal-card"><h2>♡ My Personal Space</h2><p class="quote">“${affirmations[day%affirmations.length]}”</p><button class="btn" onclick="nav('space')">Open my journal</button></div><div class="personal-card"><h2>☑ My To-Do List</h2><div id="homeTasks">${taskRows(true)}</div><div class="inline-add"><input id="homeTask" placeholder="Add a task…"><button class="btn primary" onclick="addTask('homeTask')">Add</button></div></div></section><p class="notice">Your records are saved in this browser on this device. Please use Backup regularly if you want a copy.</p>`}
function taskRows(short=false){let a=db.tasks.slice(0,short?4:99);return a.map(t=>`<label class="taskrow"><input type="checkbox" ${t.done?'checked':''} onchange="taskToggle('${t.id}',this.checked)"><span style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.text)}</span></label>`).join('')||'<p class="muted">No tasks yet.</p>'}
function products(){return pageHead('Products','Add your product name, enter your own material cost, and set its SRP.',action('Add Product',"openForm('product')"))+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Product</th><th>Material Cost</th><th>SRP</th><th>Profit / Piece</th><th></th></tr></thead><tbody>${db.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${money(p.cost)}</td><td>${money(p.srp)}</td><td>${money(Number(p.srp)-Number(p.cost))}</td><td><button class="btn" onclick="editProduct('${p.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No products yet. Add your first product.</td></tr>'}</tbody></table></div></div>`}
function portfolio(){let connected=!!localStorage.getItem('serea_public_pin');return pageHead('Product Portfolio','Upload product photos, show your SRP, and share a view-only portfolio with clients.',action('Add Portfolio Photo',"openPortfolioForm()"))+`<div class="card" style="margin-bottom:12px"><div class="kicker">✧ PUBLIC CLIENT PORTFOLIO</div><p class="muted" style="margin:5px 0 10px">Share this view-only link with clients. Product names, photos, captions, and current SRP will appear there.</p><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn primary" onclick="copyPublicPortfolioLink()">Copy Public Link</button><button class="btn" onclick="connectPublicPortfolio()">${connected?'Sync Portfolio Now':'Connect & Publish'}</button><span class="pill">${connected?'Auto-sync connected':'Not connected yet'}</span></div><p class="notice">${connected?'When you save a product price, add a photo, or remove a photo, the public portfolio updates automatically.':'Connect once with your private publishing code. After that, updates will sync automatically.'}</p></div><div class="card"><div class="kicker">✧ SEREA PRODUCT GALLERY</div><p class="muted" style="margin:5px 0 0">Choose a product from your Products list. The price shown here always follows its current SRP.</p></div><div class="portfolio-grid" style="margin-top:12px">${db.portfolio.map(x=>{let p=db.products.find(p=>p.name===x.product);return `<article class="portfolio-item"><img src="${x.image}" alt="${esc(x.product)}"><div class="portfolio-info"><h3>${esc(x.product)}</h3><b style="color:var(--pd)">${money(p?.srp||0)}</b>${x.caption?`<p style="margin-top:7px">${esc(x.caption)}</p>`:''}<button class="btn" style="margin-top:8px" onclick="deletePortfolio('${x.id}')">Remove</button></div></article>`}).join('')||'<div class="portfolio-empty" style="grid-column:1/-1">♡<br><b>Your product portfolio is waiting.</b><br><span class="muted">Upload your first product photo to get started.</span></div>'}</div><p class="notice">Your private business records remain in this browser. Only product portfolio photos, names, captions, and SRP are published for clients to view.</p>`}
function openPortfolioForm(){if(!db.products.length){alert('Add a product in the Products tab first. Its name will appear here.');return}document.getElementById('modalTitle').textContent='Add to Product Portfolio';document.getElementById('modalBody').innerHTML=`<form onsubmit="savePortfolio(event)"><div class="formgrid"><div class="field"><label>Product Name (from Products list)</label><select name="product" required><option value="">Choose a product</option>${db.products.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Product Photo</label><input type="file" name="photo" accept="image/*" required></div><div class="field" style="grid-column:1/-1"><label>Caption (optional)</label><textarea name="caption" rows="3" placeholder="Add a short product description, scent, or collection note"></textarea></div></div><p class="notice">Choose a clear photo. The website will resize it to help save space.</p><button class="btn primary" style="margin-top:12px">Save to Portfolio</button></form>`;document.getElementById('modal').classList.add('open')}
function savePortfolio(e){e.preventDefault();let f=new FormData(e.target),file=f.get('photo'),product=String(f.get('product')||'');if(!file||!file.type.startsWith('image/')){alert('Please choose an image file.');return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.78);db.portfolio.unshift({id:uid(),product,image:data,caption:String(f.get('caption')||'').trim(),createdAt:todayISO()});try{persist();closeModal();nav('portfolio');if(localStorage.getItem('serea_public_pin'))syncPublicPortfolio(true)}catch(err){db.portfolio.shift();alert('This photo may be too large for browser storage. Please try a smaller image.')}};img.onerror=()=>alert('Could not read that image. Please try another photo.');img.src=reader.result};reader.readAsDataURL(file)}
function deletePortfolio(id){if(!confirm('Remove this photo from your portfolio?'))return;db.portfolio=db.portfolio.filter(x=>x.id!==id);persist();nav('portfolio');if(localStorage.getItem('serea_public_pin'))syncPublicPortfolio(true)}
function publicPortfolioItems(){return db.portfolio.map((x,i)=>({id:x.id,product:x.product,price:Number((db.products.find(p=>p.name===x.product)||{}).srp||0),caption:x.caption||'',image:x.image,displayOrder:i}))}
async function publishWithPin(pin){let res=await fetch(SUPABASE_URL+'/functions/v1/serea-publish-portfolio',{method:'POST',headers:{'Content-Type':'application/json','x-serea-pin':pin},body:JSON.stringify({items:publicPortfolioItems()})});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||'Could not publish portfolio.');return data}
async function syncPublicPortfolio(silent=false){let pin=localStorage.getItem('serea_public_pin');if(!pin)return false;try{await publishWithPin(pin);if(!silent)alert('Your public SEREA portfolio is updated! 💜');return true}catch(err){if(!silent)alert(err.message+' Please check your internet connection or reconnect the portfolio.');else console.warn('SEREA portfolio sync:',err.message);return false}}
async function connectPublicPortfolio(){let pin=localStorage.getItem('serea_public_pin')||'';if(!pin)pin=prompt('Enter your private SEREA publishing code to connect your public portfolio:')||'';if(!pin)return;try{await publishWithPin(pin);localStorage.setItem('serea_public_pin',pin);nav('portfolio');alert('Connected! Your public portfolio is now published. Future product price and photo updates will sync automatically. 💜')}catch(err){alert(err.message||'Could not connect. Please check the publishing code and try again.')}}
function copyPublicPortfolioLink(){let link=PUBLIC_PORTFOLIO_URL;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(link).then(()=>alert('Public portfolio link copied! 💜')).catch(()=>prompt('Copy your public portfolio link:',link))}else prompt('Copy your public portfolio link:',link)}
function orders(){return pageHead('Orders','Record customer orders and update their progress.',action('Add Order',"openForm('order')"))+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Order Number</th><th>Order Date</th><th>Delivery Date</th><th>Customer</th><th>Product</th><th>Qty</th><th>Order Total</th><th>Status</th><th>Update</th></tr></thead><tbody>${db.orders.map(o=>`<tr><td><b>${esc(o.orderNumber||'—')}</b></td><td>${dateText(o.date)}</td><td>${dateText(o.dueDate)}</td><td>${esc(o.customer||'—')}</td><td>${esc(o.product)}</td><td>${o.qty}</td><td>${money(o.total)}</td><td><span class="pill">${esc(o.status)}</span></td><td><select class="status-select" onchange="updateStatus('${o.id}',this.value)">${STATUSES.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No orders yet. Add your first order.</td></tr>'}</tbody></table></div><p class="notice">Update an order from Order Received → On Production → Ready → Delivered → Paid. You can change the status anytime.</p></div>`}
function reports(){let revenue=db.orders.reduce((a,o)=>a+Number(o.total||0),0),cost=db.orders.reduce((a,o)=>a+Number((db.products.find(p=>p.name===o.product)||{}).cost||0)*Number(o.qty||0),0);return pageHead('Reports','A simple overview of your recorded products and orders.')+`<section class="metrics"><div class="metric"><span>Orders</span><strong>${db.orders.length}</strong></div><div class="metric"><span>Sales Value</span><strong>${money(revenue)}</strong></div><div class="metric"><span>Estimated Product Cost</span><strong>${money(cost)}</strong></div></section><div class="card"><h2>Product Summary</h2><div class="tablewrap"><table><thead><tr><th>Product</th><th>Cost</th><th>SRP</th><th>Profit / Piece</th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.cost)}</td><td>${money(p.srp)}</td><td>${money(p.srp-p.cost)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Add products to see a summary.</td></tr>'}</tbody></table></div></div><div class="card" style="margin-top:12px"><h2>Backup & Restore</h2><p class="muted">Download a copy of your SEREA products, orders, and to-do list.</p><button class="btn" onclick="backup()">Download Backup</button> <label class="btn">Restore Backup<input type="file" accept="application/json" style="display:none" onchange="restoreBackup(event)"></label></div>`}
function space(){let j=JSON.parse(localStorage.getItem('serea_simple_journal')||'{"dream":"","gratitude":"","intention":""}');return pageHead('My Space','Your little corner for intentions, gratitude, and growth.')+`<div class="card"><h2>Daily affirmation</h2><p class="quote">“${affirmations[new Date().getDate()%affirmations.length]}”</p><label class="field"><label>What am I working towards?</label><textarea id="dream" style="width:100%;min-height:75px;border:1px solid var(--line);border-radius:10px;padding:10px">${esc(j.dream)}</textarea></label><p><label class="field"><label>What am I grateful for?</label><textarea id="gratitude" style="width:100%;min-height:75px;border:1px solid var(--line);border-radius:10px;padding:10px">${esc(j.gratitude)}</textarea></label></p><label class="field"><label>My intention</label><textarea id="intention" style="width:100%;min-height:75px;border:1px solid var(--line);border-radius:10px;padding:10px">${esc(j.intention)}</textarea></label><button class="btn primary" style="margin-top:12px" onclick="saveJournal()">Save Journal</button></div>`}
function todo(){return pageHead('To-Do List','Keep your next steps simple and manageable.')+`<div class="card"><h2>My tasks</h2>${taskRows()}<div class="inline-add"><input id="todoTask" placeholder="What do you need to do?"><button class="btn primary" onclick="addTask('todoTask')">Add task</button></div></div>`}
function sounds(){let moods=[['Money & Abundance','Gentle, uplifting ambient tones','money'],['Peace & Calm','Soft, slow relaxing tones','peace'],['Focus & Productivity','Steady tones for work','focus'],['Frequency-inspired','Ambient tones inspired by 432 / 528 Hz','frequency']];return pageHead('SEREA Soundscape','Choose what you want to hear. You can switch moods anytime.')+`<div class="card"><div class="sound-now">♫ Now selected: ${moods.find(x=>x[2]===mood)?.[0]||'Peace & Calm'} · ${musicOn?'Playing':'Off'}</div><div class="sound-grid">${moods.map(([t,d,k])=>`<div class="sound-card ${mood===k?'selected':''}"><h3>♫ ${t}</h3><p>${d}</p><button class="btn ${mood===k?'selected':''}" onclick="setMood('${k}')">${mood===k&&musicOn?'Playing ✓':'Play this sound'}</button></div>`).join('')}</div><p class="notice">Choose any sound and it changes immediately—no need to wait for the current one to finish. These are gentle synthesized ambient tones, not commercial songs or scientifically proven money-attracting frequencies. On iPhone, tap Play once to allow audio.</p><button class="btn primary" onclick="toggleMusic()">${musicOn?'♫ Turn sound OFF':'♫ Turn sound ON'}</button></div>`}
function openForm(type,id=''){let p=id?db.products.find(x=>x.id===id):null;let html='',title='';if(type==='product'){title=p?'Edit Product':'Add New Product';html=`<form onsubmit="saveProduct(event,'${id}')"><div class="formgrid"><div class="field"><label>Product Name</label><input name="name" required value="${esc(p?.name||'')}" placeholder="e.g. Bloom in a Jar"></div><div class="field"><label>Material Cost (₱)</label><input name="cost" type="number" min="0" step="0.01" required value="${p?.cost??''}" placeholder="Enter your manual costing"></div><div class="field"><label>Selling Price / SRP (₱)</label><input name="srp" type="number" min="0" step="0.01" required value="${p?.srp??''}" placeholder="Enter selling price"></div></div><p class="notice">Manual costing lang ito—ikaw ang magko-compute ng total material cost. Walang raw materials list or automatic inventory tracking.</p><button class="btn primary" style="margin-top:12px">Save Product</button></form>`}else{title='Add New Order';html=`<form onsubmit="saveOrder(event)"><div class="formgrid"><div class="field"><label>Order Number (from TakeApp)</label><input name="orderNumber" placeholder="e.g. TA-1025"></div><div class="field"><label>Order Date</label><input type="date" name="date" value="${todayISO()}" required></div><div class="field"><label>Delivery Date / Deadline</label><input type="date" name="dueDate" required></div><div class="field"><label>Customer Name</label><input name="customer" placeholder="Customer name"></div><div class="field"><label>Product</label><select name="product" id="orderProduct" onchange="orderTotalPreview()" required><option value="">Choose product</option>${db.products.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input name="qty" id="orderQty" type="number" min="1" step="1" value="1" oninput="orderTotalPreview()" required></div><div class="field"><label>Order Total (₱)</label><input name="total" id="orderTotal" type="number" step="0.01" readonly></div><div class="field"><label>Status</label><select name="status">${STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div></div><div id="orderHint" class="notice">Choose a product and quantity. Total is based on the product SRP.</div><button class="btn primary" style="margin-top:12px">Save Order</button></form>`}document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}function editProduct(id){openForm('product',id)}function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),obj={id:id||uid(),name:String(f.get('name')).trim(),cost:Number(f.get('cost')),srp:Number(f.get('srp'))};if(id){let i=db.products.findIndex(p=>p.id===id);db.products[i]=obj}else db.products.push(obj);persist();closeModal();nav('products');if(localStorage.getItem('serea_public_pin')&&db.portfolio.some(x=>x.product===obj.name))syncPublicPortfolio(true)}
function orderTotalPreview(){let p=db.products.find(x=>x.name===document.getElementById('orderProduct')?.value),q=Number(document.getElementById('orderQty')?.value||0);let el=document.getElementById('orderTotal');if(el)el.value=p&&q>0?(p.srp*q).toFixed(2):'0.00'}function saveOrder(e){e.preventDefault();let f=new FormData(e.target),product=String(f.get('product')),qty=Number(f.get('qty')),p=db.products.find(x=>x.name===product);if(!p){alert('Please choose a product.');return}db.orders.push({id:uid(),orderNumber:String(f.get('orderNumber')||'').trim(),date:f.get('date'),dueDate:f.get('dueDate'),customer:String(f.get('customer')||'').trim(),product,qty,total:qty*p.srp,paid:0,status:f.get('status'),notes:''});persist();closeModal();nav('orders')}
function updateStatus(id,status){let o=db.orders.find(x=>x.id===id);if(!o)return;o.status=status;persist();nav('orders')}function taskToggle(id,v){let t=db.tasks.find(x=>x.id===id);if(t)t.done=v;persist();nav(currentPage())}function currentPage(){return document.querySelector('#nav button.active')?.dataset.page||'home'}function addTask(id){let e=document.getElementById(id);if(!e||!e.value.trim())return;db.tasks.push({id:uid(),text:e.value.trim(),done:false});persist();nav(currentPage())}function saveJournal(){localStorage.setItem('serea_simple_journal',JSON.stringify({dream:document.getElementById('dream').value,gratitude:document.getElementById('gratitude').value,intention:document.getElementById('intention').value}));alert('Journal saved 💜')}
let audio=null,gain=null,osc=[],musicOn=localStorage.getItem('serea_music_on')==='true',musicStarted=false,mood=localStorage.getItem('serea_music_mood')||'peace';function musicUI(){let b=document.getElementById('musicToggle'),s=document.getElementById('musicState');if(b&&s){b.classList.toggle('on',musicOn);s.textContent=musicOn?'Music ON':'Music OFF'}}function startMusic(){try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();if(audio.state==='suspended')audio.resume();if(musicStarted){gain.gain.setTargetAtTime(.045,audio.currentTime,.3);return}gain=audio.createGain();gain.gain.value=0;gain.connect(audio.destination);let freqs=mood==='money'?[220,329.63,440]:mood==='frequency'?[216,264,396]:mood==='focus'?[174.61,220,261.63]:[196,246.94,293.66];freqs.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.value=[.22,.14,.1][i];o.connect(g);g.connect(gain);o.start();osc.push(o)});gain.gain.setTargetAtTime(.045,audio.currentTime,.8);musicStarted=true}catch(e){console.log(e)}}function toggleMusic(){musicOn=!musicOn;localStorage.setItem('serea_music_on',String(musicOn));if(musicOn)startMusic();else if(gain&&audio)gain.gain.setTargetAtTime(0,audio.currentTime,.2);musicUI()}function setMood(m){mood=m;localStorage.setItem('serea_music_mood',m);if(musicStarted&&audio&&gain){gain.gain.setTargetAtTime(0,audio.currentTime,.08);osc.forEach(o=>{try{o.stop(audio.currentTime+.18)}catch(e){}});osc=[];musicStarted=false}musicOn=true;localStorage.setItem('serea_music_on','true');startMusic();musicUI();if(currentPage()==='sounds')nav('sounds')}
function backup(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='serea-backup-'+todayISO()+'.json';a.click();URL.revokeObjectURL(a.href)}function restoreBackup(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.products)||!Array.isArray(d.orders))throw 0;db=d;db.portfolio=Array.isArray(db.portfolio)?db.portfolio:[];db.tasks=Array.isArray(db.tasks)?db.tasks:[];persist();nav('home');alert('Backup restored!')}catch{alert('Invalid SEREA backup file.')}};r.readAsText(file)}
let current='home';init();
</script></body></html>
